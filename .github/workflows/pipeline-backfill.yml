# Backfill Pipeline — bulk-load multiple dates into Snowflake, then run dbt/ML once
# Use this to catch up on missed pipeline runs.
#
# Strategy (faster than date-by-date full runs):
#   1. COPY INTO for each date in range (loads all raw data)
#   2. Dedup once (handles all duplicates in one pass)
#   3. dbt snapshot + run + test once (incremental models process all new data)
#   4. Post-processing once
#   5. ML scoring once (scores on latest full dataset)
#   6. Optimization + Experimentation once

name: Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-03-11'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-04-11'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_DATABASE: FULFILLMENT_DB
  SNOWFLAKE_WAREHOUSE: FULFILLMENT_WH
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-2
  S3_BUCKET_NAME: last-mile-fulfillment-platform

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: pipeline-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install --no-interaction
          pip install dbt-snowflake

      # ── Phase 1: Bulk COPY INTO for all dates ──────────────────
      - name: COPY INTO for all dates (${{ inputs.start_date }} to ${{ inputs.end_date }})
        run: |
          echo "Loading data from ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          current="${{ inputs.start_date }}"
          end="${{ inputs.end_date }}"
          count=0
          while [[ "$current" < "$end" || "$current" == "$end" ]]; do
            echo "--- COPY INTO: $current ---"
            poetry run python .github/scripts/run_pipeline.py copy-into --date "$current"
            current=$(date -d "$current + 1 day" +%Y-%m-%d)
            count=$((count + 1))
          done
          echo "Loaded $count dates"

      # ── Phase 2: Dedup once ────────────────────────────────────
      - name: Dedup RAW tables
        run: poetry run python .github/scripts/run_pipeline.py dedup

      - name: Verify row counts
        run: poetry run python .github/scripts/run_pipeline.py verify

      # ── Phase 3: dbt (processes all new incremental data) ──────
      - name: dbt snapshot
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt snapshot --profiles-dir .

      - name: dbt run
        working-directory: dbt
        run: dbt run --profiles-dir .

      - name: dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .

      # ── Phase 4: Post-processing ───────────────────────────────
      - name: Post-processing
        run: poetry run python .github/scripts/run_pipeline.py post-processing

      # ── Phase 5: ML scoring (on full updated dataset) ──────────
      - name: ML - Demand + Stockout
        run: poetry run python -m ml.training.predict_and_writeback --phase demand stockout

      - name: ML - ETA
        run: poetry run python -m ml.training.predict_and_writeback --phase eta

      - name: ML - Future Demand Forecast
        run: poetry run python -m ml.training.predict_and_writeback --phase future_demand

      # ── Phase 6: Optimization + Experimentation ────────────────
      - name: Optimization
        run: poetry run python -m optimization.run_optimization

      - name: Experimentation
        run: poetry run python -m experimentation.run_experimentation

      - name: Backfill complete
        run: |
          echo "============================================="
          echo "  BACKFILL COMPLETE"
          echo "  Range: ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          echo "  Time: $(date -u)"
          echo "============================================="
